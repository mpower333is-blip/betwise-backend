name: soccer_predictor
description: BetWise AI

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  http: ^1.6.0
  flutter_dotenv: ^6.0.1

  # For network club logos later
  cached_network_image: ^3.3.1

  # Optional date formatting for live kickoff times
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/.env
    - assets/teams/